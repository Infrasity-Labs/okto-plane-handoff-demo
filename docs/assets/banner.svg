<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
  </g>

  <!-- three node motif: spec -> handoff -> proof -->
  <g transform="translate(880,60)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#accent1)" stroke-width="3"/>
    <circle cx="150" cy="60" r="14" fill="none" stroke="url(#accent2)" stroke-width="3"/>
    <circle cx="300" cy="10" r="14" fill="none" stroke="url(#accent1)" stroke-width="3"/>
    <path d="M14 3 L138 55" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M162 53 L288 15" stroke="#475569" stroke-width="2" fill="none"/>
  </g>

  <text x="80" y="140" font-family="'SF Mono','Menlo',monospace" font-size="15" fill="#38bdf8" letter-spacing="2">OKTO PULSE + OKTO NEXUS</text>

  <text x="78" y="200" font-family="-apple-system,'Segoe UI',sans-serif" font-size="46" font-weight="700" fill="#f8fafc">One spec-gated feature.</text>
  <text x="78" y="252" font-family="-apple-system,'Segoe UI',sans-serif" font-size="46" font-weight="700" fill="#f8fafc">Two agent roles, one handoff.</text>

  <text x="80" y="290" font-family="-apple-system,'Segoe UI',sans-serif" font-size="17" fill="#94a3b8">A governance layer that decides what "done" means, and a coordination layer that decides who acts next.</text>
</svg>
