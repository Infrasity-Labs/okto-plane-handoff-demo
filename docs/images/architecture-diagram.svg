<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>

  <!-- frame bars -->
  <rect x="0" y="0" width="1200" height="8" fill="#111827"/>
  <rect x="0" y="772" width="1200" height="8" fill="#111827"/>

  <!-- title -->
  <text x="600" y="56" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Conceptual Architecture</text>

  <!-- ============ LAYER BOXES ============ -->
  <!-- Layer 1: Agent Layer -->
  <rect x="40" y="110" width="350" height="610" fill="none" stroke="#111827" stroke-width="2.5"/>
  <rect x="55" y="98" width="150" height="24" fill="#ffffff"/>
  <text x="60" y="115" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Agent Layer</text>

  <!-- Layer 2: Coordination Layer -->
  <rect x="425" y="110" width="350" height="610" fill="none" stroke="#111827" stroke-width="2.5"/>
  <rect x="440" y="98" width="230" height="24" fill="#ffffff"/>
  <text x="445" y="115" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Coordination Layer</text>

  <!-- Layer 3: Target Application Layer -->
  <rect x="810" y="110" width="350" height="610" fill="none" stroke="#111827" stroke-width="2.5"/>
  <rect x="825" y="98" width="270" height="24" fill="#ffffff"/>
  <text x="830" y="115" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Target Application Layer</text>

  <!-- ============ LAYER 1 CONTENT: 4-stage agent chain ============ -->
  <rect x="100" y="150" width="230" height="530" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,4" rx="6"/>

  <!-- spec-agent: document icon -->
  <g transform="translate(194,172)">
    <path d="M0,0 H30 L42,12 V58 H0 Z" fill="#eef4fb" stroke="#2f6690" stroke-width="2"/>
    <path d="M30,0 L30,12 L42,12" fill="none" stroke="#2f6690" stroke-width="2"/>
    <line x1="8" y1="26" x2="34" y2="26" stroke="#2f6690" stroke-width="2"/>
    <line x1="8" y1="36" x2="34" y2="36" stroke="#2f6690" stroke-width="2"/>
    <line x1="8" y1="46" x2="24" y2="46" stroke="#2f6690" stroke-width="2"/>
  </g>
  <text x="215" y="252" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#111827">spec-agent</text>
  <text x="215" y="268" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">ideation → refinement → spec</text>
  <line x1="215" y1="280" x2="215" y2="310" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- backend-agent: server icon -->
  <g transform="translate(192,314)">
    <rect x="0" y="0" width="46" height="52" rx="4" fill="#eef4fb" stroke="#2f6690" stroke-width="2"/>
    <line x1="8" y1="13" x2="38" y2="13" stroke="#2f6690" stroke-width="2"/>
    <line x1="8" y1="26" x2="38" y2="26" stroke="#2f6690" stroke-width="2"/>
    <line x1="8" y1="39" x2="38" y2="39" stroke="#2f6690" stroke-width="2"/>
    <circle cx="34" cy="13" r="1.6" fill="#0d9488"/>
    <circle cx="34" cy="26" r="1.6" fill="#0d9488"/>
    <circle cx="34" cy="39" r="1.6" fill="#0d9488"/>
  </g>
  <text x="215" y="386" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#111827">backend-agent</text>
  <text x="215" y="402" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">implements against plane/</text>
  <line x1="215" y1="414" x2="215" y2="444" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- frontend-agent: monitor icon -->
  <g transform="translate(188,448)">
    <rect x="0" y="0" width="54" height="36" rx="3" fill="#eef4fb" stroke="#2f6690" stroke-width="2"/>
    <line x1="27" y1="36" x2="27" y2="46" stroke="#2f6690" stroke-width="2"/>
    <line x1="15" y1="46" x2="39" y2="46" stroke="#2f6690" stroke-width="2"/>
    <path d="M10,10 h6 M10,10 v6 M44,10 h-6 M44,10 v6 M10,26 h6 M10,26 v-6 M44,26 h-6 M44,26 v-6" stroke="#0d9488" stroke-width="2" fill="none"/>
  </g>
  <text x="215" y="518" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#111827">frontend-agent</text>
  <text x="215" y="534" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">Issues List UI + Playwright</text>
  <line x1="215" y1="546" x2="215" y2="576" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- validator-agent: shield icon -->
  <g transform="translate(200,580)">
    <path d="M15,0 L30,6 V20 C30,32 15,38 15,38 C15,38 0,32 0,20 V6 Z" fill="#eef4fb" stroke="#2f6690" stroke-width="2"/>
    <path d="M6,19 L12,25 L24,11" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="215" y="636" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#111827">validator-agent</text>
  <text x="215" y="652" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">task-validation gate</text>

  <!-- MCP pill, outside dotted box -->
  <rect x="150" y="672" width="130" height="30" rx="15" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
