<svg width="720" height="870" viewBox="0 0 720 870" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="720" height="870" fill="url(#bg)"/>

  <!-- header -->
  <text x="360" y="34" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f8fafc">One Claude Code session, four named agent identities</text>
  <text x="360" y="54" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">each MCP call carries the identity for its stage — not a separate program per agent</text>

  <!-- legend chips -->
  <g font-family="'SF Mono','Menlo',monospace" font-size="11" font-weight="600">
    <rect x="38" y="76" width="155" height="26" rx="13" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="115" y="93" text-anchor="middle" fill="#22d3ee">spec-agent</text>

    <rect x="201" y="76" width="155" height="26" rx="13" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
    <text x="278" y="93" text-anchor="middle" fill="#fb923c">backend-agent</text>

    <rect x="364" y="76" width="155" height="26" rx="13" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="441" y="93" text-anchor="middle" fill="#34d399">frontend-agent</text>

    <rect x="527" y="76" width="155" height="26" rx="13" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="604" y="93" text-anchor="middle" fill="#f472b6">validator-agent</text>
  </g>

  <line x1="40" y1="120" x2="680" y2="120" stroke="#334155" stroke-width="1"/>

  <!-- Stage 0: Setup -->
  <g>
    <rect x="40" y="132" width="640" height="58" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="64" cy="161" r="14" fill="#64748b"/>
    <text x="64" y="166" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">0</text>
    <text x="92" y="154" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Setup</text>
    <text x="92" y="172" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">Fork + scaffold Plane's stack; register Pulse/Nexus identities</text>
    <rect x="552" y="141" width="120" height="20" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="612" y="155" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#64748b">operator</text>
    <text x="612" y="178" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b">plane/ + Pulse + Nexus</text>
  </g>

  <!-- Stage 1: Ideate -->
  <g>
    <rect x="40" y="200" width="640" height="58" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="64" cy="229" r="14" fill="#22d3ee"/>
    <text x="64" y="234" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">1</text>
    <text x="92" y="222" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Ideate</text>
    <text x="92" y="240" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">Ambiguity-killer Q&amp;A: sync/async threshold, CSV columns, URL expiry</text>
    <rect x="552" y="209" width="120" height="20" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="612" y="223" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#22d3ee">spec-agent</text>
    <text x="612" y="246" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b">Pulse</text>
  </g>

  <!-- Stage 2: Refine -->
  <g>
    <rect x="40" y="268" width="640" height="58" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="64" cy="297" r="14" fill="#22d3ee"/>
    <text x="64" y="302" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">2</text>
    <text x="92" y="290" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Refine</text>
    <text x="92" y="308" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">Codebase investigation supersedes 3 ideation assumptions</text>
    <rect x="552" y="277" width="120" height="20" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="612" y="291" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#22d3ee">spec-agent</text>
    <text x="612" y="314" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b">Pulse</text>
  </g>

  <!-- Stage 3: Spec -->
  <g>
    <rect x="40" y="336" width="640" height="58" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="64" cy="365" r="14" fill="#22d3ee"/>
    <text x="64" y="370" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">3</text>
    <text x="92" y="358" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Spec</text>
    <text x="92" y="376" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">8 FRs, 5 TRs, 6 ACs, 1 API contract — validated 85/86/84/85/18</text>
    <rect x="552" y="345" width="120" height="20" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="612" y="359" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#22d3ee">spec-agent</text>
    <text x="612" y="382" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b">Pulse</text>
  </g>

  <!-- Stage 4: Sprint -->
  <g>
    <rect x="40" y="404" width="640" height="58" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="64" cy="433" r="14" fill="#22d3ee"/>
    <text x="64" y="438" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">4</text>
    <text x="92" y="426" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Sprint</text>
    <text x="92" y="444" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">4 cards created, dependency-linked, sprint made active</text>
    <rect x="552" y="413" width="120" height="20" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="612" y="427" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#22d3ee">spec-agent</text>
    <text x="612" y="450" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b">Pulse</text>
  </g>

  <!-- Stage 5: Backend implementation -->
  <g>
    <rect x="40" y="472" width="640" height="58" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
    <circle cx="64" cy="501" r="14" fill="#fb923c"/>
    <text x="64" y="506" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">5</text>
    <text x="92" y="494" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Backend implementation</text>
    <text x="92" y="512" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">Export endpoint + Celery task extension, 17/17 tests, card → done</text>
    <rect x="552" y="481" width="120" height="20" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
    <text x="612" y="495" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#fb923c">backend-agent</text>
    <text x="612" y="518" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b">plane/</text>
  </g>

  <!-- Stage 6: Handoff -->
  <g>
    <rect x="40" y="540" width="640" height="58" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <circle cx="64" cy="569" r="14" fill="#a855f7"/>
    <text x="64" y="574" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">6</text>
    <text x="92" y="562" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Handoff</text>
    <text x="92" y="580" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">handoff_create &#8594; claim &#8594; complete, API contract as artifact</text>
    <rect x="552" y="549" width="120" height="20" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="612" y="563" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#a855f7">Nexus</text>
    <text x="612" y="586" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="8.5" fill="#64748b">backend&#8594;frontend</text>
  </g>

  <!-- Stage 7: Frontend implementation -->
  <g>
    <rect x="40" y="608" width="640" height="58" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <circle cx="64" cy="637" r="14" fill="#34d399"/>
    <text x="64" y="642" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">7</text>
    <text x="92" y="630" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Frontend implementation</text>
    <text x="92" y="648" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">Toolbar action against delivered contract, clean typecheck</text>
    <rect x="552" y="617" width="120" height="20" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="612" y="631" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#34d399">frontend-agent</text>
    <text x="612" y="654" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b">plane/</text>
  </g>

  <!-- Stage 8: Task validation gate -->
  <g>
    <rect x="40" y="676" width="640" height="58" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <circle cx="64" cy="705" r="14" fill="#f472b6"/>
    <text x="64" y="710" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">8</text>
    <text x="92" y="698" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Task validation gate</text>
    <text x="92" y="716" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">completeness=78 rejected at board threshold 80</text>
    <rect x="552" y="685" width="120" height="20" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="612" y="699" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#f472b6">validator-agent</text>
    <text x="612" y="722" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b">Pulse</text>
  </g>

  <!-- Stage 9: Extending test coverage -->
  <g>
    <rect x="40" y="744" width="640" height="58" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <circle cx="64" cy="773" r="14" fill="#34d399"/>
    <text x="64" y="778" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">9</text>
    <text x="92" y="766" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Extending test coverage</text>
    <text x="92" y="784" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#94a3b8">Playwright e2e added, pipeline verified live, real regression fixed</text>
    <rect x="552" y="753" width="120" height="20" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="612" y="767" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#34d399">frontend-agent</text>
    <text x="612" y="790" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b">plane/</text>
  </g>

  <!-- footer -->
  <text x="360" y="826" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">Pulse governs stages 1–4 &amp; 8 · Nexus governs stage 6 · plane/ receives real code at 5, 7, 9</text>
  <text x="360" y="846" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">One Claude Code session throughout; each agent name above is the MCP identity active for that stage</text>
</svg>
