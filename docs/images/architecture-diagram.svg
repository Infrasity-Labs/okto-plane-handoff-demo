<svg width="720" height="580" viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="720" height="580" fill="url(#bg)"/>

  <!-- connectors: client -> pulse / nexus -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M330 90 L200 148"/>
    <path d="M390 90 L520 148"/>
  </g>
  <text x="248" y="115" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#64748b">MCP</text>
  <text x="472" y="115" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#64748b">MCP</text>

  <!-- connectors: pulse / nexus -> plane -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M200 342 L305 408"/>
    <path d="M520 342 L415 408"/>
  </g>
  <text x="228" y="382" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">governs WHAT</text>
  <text x="492" y="382" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">governs WHO, WHEN</text>

  <!-- Agent Client -->
  <rect x="260" y="24" width="200" height="64" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="360" y="52" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Agent Client</text>
  <text x="360" y="72" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">Claude Code, one session</text>

  <!-- Okto Pulse -->
  <rect x="40" y="150" width="300" height="192" rx="10" fill="#0f172a" stroke="#0891b2" stroke-width="2"/>
  <text x="190" y="180" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Okto Pulse</text>
  <text x="190" y="198" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#94a3b8">:8100 / :8101</text>
  <line x1="64" y1="210" x2="316" y2="210" stroke="#334155" stroke-width="1"/>
  <g font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#cbd5e1">
    <circle cx="66" cy="232" r="2.5" fill="#0891b2"/>
    <text x="76" y="237">ideation &#8594; refinement &#8594; spec</text>
    <circle cx="66" cy="260" r="2.5" fill="#0891b2"/>
    <text x="76" y="265">5-dimension validation gate</text>
    <circle cx="66" cy="288" r="2.5" fill="#0891b2"/>
    <text x="76" y="293">sprint &#8594; cards</text>
    <circle cx="66" cy="316" r="2.5" fill="#0891b2"/>
    <text x="76" y="321">task validation gate</text>
  </g>

  <!-- Okto Nexus -->
  <rect x="380" y="150" width="300" height="192" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="530" y="180" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Okto Nexus</text>
  <text x="530" y="198" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#94a3b8">:8202</text>
  <line x1="404" y1="210" x2="656" y2="210" stroke="#334155" stroke-width="1"/>
  <g font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#cbd5e1">
    <circle cx="406" cy="232" r="2.5" fill="#a855f7"/>
    <text x="416" y="237">handoff_create (API contract)</text>
    <circle cx="406" cy="260" r="2.5" fill="#a855f7"/>
    <text x="416" y="265">handoff_claim, atomic winner</text>
    <circle cx="406" cy="288" r="2.5" fill="#a855f7"/>
    <text x="416" y="293">handoff_complete</text>
    <circle cx="406" cy="316" r="2.5" fill="#a855f7"/>
    <text x="416" y="321">event log, replayable</text>
  </g>

  <!-- plane/ fork -->
  <rect x="210" y="410" width="300" height="94" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="360" y="440" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="16" font-weight="700" fill="#f8fafc">plane/ fork</text>
  <text x="360" y="460" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">Django API + React/Vite web</text>
  <text x="360" y="478" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#64748b">branch: feature/issue-csv-export</text>

  <!-- caption -->
  <text x="360" y="536" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">No shared code, config, or service between Pulse and Nexus.</text>
  <text x="360" y="556" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">One agent client, two MCP connections, one shared checkout.</text>
</svg>
