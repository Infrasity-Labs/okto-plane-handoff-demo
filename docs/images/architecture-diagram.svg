<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="640" height="300" fill="url(#bg)"/>

  <!-- connectors -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M300 78 L175 130"/>
    <path d="M340 78 L465 130"/>
    <path d="M150 194 L280 234"/>
    <path d="M490 194 L360 234"/>
  </g>

  <!-- Agent Client -->
  <rect x="230" y="20" width="180" height="56" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="44" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Agent Client</text>
  <text x="320" y="63" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">Claude Code</text>

  <!-- Okto Pulse -->
  <rect x="20" y="130" width="210" height="60" rx="8" fill="#0f172a" stroke="#0891b2" stroke-width="2"/>
  <text x="125" y="156" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Okto Pulse</text>
  <text x="125" y="176" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#94a3b8">:8100 / :8101</text>

  <!-- Okto Nexus -->
  <rect x="410" y="130" width="210" height="60" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="515" y="156" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Okto Nexus</text>
  <text x="515" y="176" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#94a3b8">:8202</text>

  <!-- plane/ fork -->
  <rect x="230" y="234" width="180" height="52" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="320" y="258" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="14" font-weight="700" fill="#f8fafc">plane/ fork</text>
  <text x="320" y="276" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#94a3b8">Django + React</text>

  <!-- edge labels -->
  <text x="125" y="215" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">governs WHAT</text>
  <text x="515" y="215" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">governs WHO, WHEN</text>
</svg>
