  <!-- arrow layer1 -> layer2 -->
  <line x1="390" y1="390" x2="418" y2="390" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- ============ LAYER 2 CONTENT: Pulse + Nexus pipeline ============ -->
  <!-- Pulse KG cylinder -->
  <g transform="translate(555,160)">
    <path d="M0,10 C0,4 20,0 45,0 C70,0 90,4 90,10 V54 C90,60 70,64 45,64 C20,64 0,60 0,54 Z" fill="#dbeafe" stroke="#2f6690" stroke-width="2"/>
    <path d="M0,10 C0,16 20,20 45,20 C70,20 90,16 90,10" fill="none" stroke="#2f6690" stroke-width="2"/>
  </g>
  <text x="600" y="246" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#111827">Pulse Knowledge Graph</text>
  <text x="600" y="262" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">boards · specs · decisions</text>
  <line x1="600" y1="274" x2="600" y2="304" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Spec / Sprint documents -->
  <g transform="translate(578,308)">
    <path d="M0,0 H26 L36,10 V50 H0 Z" fill="#eef4fb" stroke="#2f6690" stroke-width="2"/>
    <path d="M26,0 L26,10 L36,10" fill="none" stroke="#2f6690" stroke-width="2"/>
    <line x1="7" y1="24" x2="30" y2="24" stroke="#2f6690" stroke-width="1.8"/>
    <line x1="7" y1="34" x2="30" y2="34" stroke="#2f6690" stroke-width="1.8"/>
  </g>
  <text x="600" y="378" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#111827">Spec / Sprint / Cards</text>
  <line x1="600" y1="390" x2="600" y2="420" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Nexus Handoff Log box -->
  <rect x="530" y="424" width="140" height="56" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="600" y="448" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#111827">Nexus Handoff Log</text>
  <text x="600" y="464" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6b7280">create · claim · complete</text>
  <line x1="600" y1="480" x2="600" y2="510" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Task Validation Gate box -->
  <rect x="510" y="514" width="180" height="56" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="600" y="538" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#111827">Task Validation Gate</text>
  <text x="600" y="554" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6b7280">enforces threshold before done</text>

  <!-- arrow layer2 -> layer3 -->
  <line x1="775" y1="390" x2="803" y2="390" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- ============ LAYER 3 CONTENT ============ -->
  <!-- API document icon -->
  <g transform="translate(965,172)">
    <path d="M0,0 H30 L42,12 V58 H0 Z" fill="#eef4fb" stroke="#2f6690" stroke-width="2"/>
    <path d="M30,0 L30,12 L42,12" fill="none" stroke="#2f6690" stroke-width="2"/>
    <line x1="8" y1="26" x2="34" y2="26" stroke="#2f6690" stroke-width="2"/>
    <line x1="8" y1="36" x2="34" y2="36" stroke="#2f6690" stroke-width="2"/>
    <line x1="8" y1="46" x2="24" y2="46" stroke="#2f6690" stroke-width="2"/>
  </g>
  <text x="985" y="252" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#111827">Django REST API</text>
  <text x="985" y="268" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">CSV export pipeline</text>
  <line x1="985" y1="280" x2="985" y2="310" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Web app monitor icon -->
  <g transform="translate(950,314)">
    <rect x="0" y="0" width="70" height="46" rx="3" fill="#eef4fb" stroke="#2f6690" stroke-width="2"/>
    <line x1="35" y1="46" x2="35" y2="58" stroke="#2f6690" stroke-width="2"/>
    <line x1="18" y1="58" x2="52" y2="58" stroke="#2f6690" stroke-width="2"/>
    <path d="M12,12 h8 M12,12 v8 M58,12 h-8 M58,12 v8 M12,34 h8 M12,34 v-8 M58,34 h-8 M58,34 v-8" stroke="#0d9488" stroke-width="2.2" fill="none"/>
  </g>
  <text x="985" y="394" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#111827">React / Vite Web</text>
  <text x="985" y="410" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">Issues List, filter-aware export</text>

  <line x1="985" y1="420" x2="985" y2="450" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Playwright tests document icon -->
  <g transform="translate(965,454)">
    <path d="M0,0 H30 L42,12 V58 H0 Z" fill="#eef4fb" stroke="#2f6690" stroke-width="2"/>
    <path d="M30,0 L30,12 L42,12" fill="none" stroke="#2f6690" stroke-width="2"/>
    <path d="M10,24 L18,32 L32,16" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="985" y="534" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#111827">Playwright Suite</text>
  <text x="985" y="550" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">end-to-end vs docker-compose</text>

  <!-- footer caption -->
  <text x="600" y="750" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#6b7280">Pulse governs what to build · Nexus governs who acts and when · both target the same plane/ checkout</text>
</svg>
